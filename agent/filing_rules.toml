# Filing rules and scoring for the triage skill (A2/A3/A14).
#
# ============================================================================
#  TEAM-OWNED.  Written as a DRAFT with AI help on 22 Sept 2026.
#  These values decide what the agent files and what it refuses, which is a
#  graded judgement.  Review every value, change what you disagree with, and
#  commit the result yourselves.
# ============================================================================

[scoring]
# A file is moved only if its best folder scores at least this much AND at
# least one signal other than the description and the sender points to it.
threshold = 3

[scoring.weights]
linked_record = 3            # file is linked to a business record (e.g. an Item)
filename_pattern = 2         # filename matches a document type below
similar_file_in_folder = 1   # a file of the same kind already lives in that folder
sender = 1                   # a known sender/party; supports a destination, never picks one
description = 1              # "Belongs in X"; counts ONLY if another signal agrees

# Document types. `folder` is the default destination; for drawings the folder
# is taken from where drawings with the same code prefix already live, falling
# back to [drawing_prefix_folders].
[[doc_type]]
name = "timesheet"
patterns = ['(?i)time[ _-]?sheet']
folder = "HR"

[[doc_type]]
name = "w9"
patterns = ['(?i)(^|[^a-z0-9])w-?9([^0-9]|$)']
folder = "Purchasing"

[[doc_type]]
name = "purchase_order"
patterns = ['(?i)^po[_ -]?\d+', '(?i)purchase[ _-]order']
folder = "Purchasing"

[[doc_type]]
name = "mill_certificate"
patterns = ['(?i)mill[ _-]?cert', '(?i)^cert[_ -]']
folder = "Quality"

[[doc_type]]
name = "drawing"
patterns = ['(?i)^[a-z0-9]+(-[a-z0-9]+)+[_ -]rev\.?[a-z0-9]{1,3}([_ .-]|$)']
folder = ""

[drawing_prefix_folders]
J = "Jig & Fixture Drawings"
KJ = "Production Drawings"
FG = "Production Drawings"
